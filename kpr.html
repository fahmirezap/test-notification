<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<title>KPR Saya</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}

body{

background:#0C78D1;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.phone{

width:390px;
height:780px;
background:#F4F6F9;
border-radius:35px;
overflow:hidden;

}

.header{

background:#00529C;
color:white;
padding:20px;
font-size:24px;
font-weight:bold;

}

.content{

padding:20px;

}

.banner{

background:#FFF3CD;
border-left:6px solid orange;
padding:18px;
border-radius:10px;
margin-bottom:20px;

}

.banner h3{

margin-bottom:10px;
color:#B36B00;

}

.card{

background:white;
padding:18px;
border-radius:12px;
margin-top:15px;

}

.label{

color:gray;
font-size:14px;

}

.value{

font-size:22px;
font-weight:bold;
margin-top:5px;

}

.button{

display:block;
margin-top:25px;
padding:15px;
text-align:center;
background:#FF7A00;
color:white;
font-weight:bold;
border-radius:10px;
text-decoration:none;

}

</style>

</head>

<body>

<div class="phone">

<div class="header">

🏠 KPR Saya

</div>

<div class="content">

<div class="banner">

<h3>

🔔 Pengingat Perubahan Suku Bunga

</h3>

Periode <b>Fixed Rate</b> Anda akan
berakhir dalam <b>60 hari</b>.

</div>

<div class="card">

<div class="label">

Status

</div>

<div class="value">

Fixed Rate

</div>

</div>

<div class="card">

<div class="label">

Tanggal Perubahan

</div>

<div class="value">

16 Juni 2026

</div>

</div>

<div class="card">

<div class="label">

Estimasi Angsuran Baru

</div>

<div class="value">

Rp4.850.000

</div>

</div>

<a class="button"
href="simulasi.html">

Lihat Simulasi Angsuran

</a>

</div>

</div>

</html>
