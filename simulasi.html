<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Simulasi Angsuran</title>

<style>

body{

margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#00529C;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.phone{

width:390px;
height:780px;
background:white;
border-radius:35px;
overflow:hidden;

}

.header{

background:#00529C;
padding:18px;
color:white;
font-size:22px;
font-weight:bold;

}

.content{

padding:25px;

}

.card{

background:#F4F6F9;
padding:18px;
border-radius:12px;
margin-bottom:18px;

}

.label{

color:#666;
font-size:14px;

}

.value{

font-size:22px;
font-weight:bold;
margin-top:5px;

}

.compare{

display:flex;
justify-content:space-between;
margin-top:15px;

}

.box{

width:45%;
background:#F8F8F8;
padding:15px;
border-radius:10px;
text-align:center;

}

.orange{

color:#FF7A00;
font-weight:bold;

}

button{

width:100%;
margin-top:25px;
padding:15px;
background:#FF7A00;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;

}

.note{

margin-top:15px;
font-size:13px;
color:#666;
text-align:center;

}

</style>

</head>

<body>

<div class="phone">

<div class="header">

Simulasi Angsuran

</div>

<div class="content">

<div class="card">

<div class="label">
Nomor Pinjaman
</div>

<div class="value">
********1234
</div>

</div>

<div class="card">

<div class="label">
Tanggal Perubahan Suku Bunga
</div>

<div class="value">
16 Juni 2026
</div>

</div>

<div class="compare">

<div class="box">

<div class="label">
Saat Ini
</div>

<h2>Rp4.200.000</h2>

<p>Fixed Rate</p>

</div>

<div class="box">

<div class="label">
Estimasi Baru
</div>

<h2 class="orange">
Rp4.850.000
</h2>

<p>Floating Rate</p>

</div>

</div>

<div class="card">

<div class="label">
Perkiraan Kenaikan Angsuran
</div>

<div class="value orange">

+ Rp650.000/bulan

</div>

</div>

<button>

Hubungi Relationship Manager

</button>

<div class="note">

*Simulasi ini merupakan estimasi berdasarkan suku bunga yang berlaku saat ini.

</div>

</div>

</div>

</body>

</html>
