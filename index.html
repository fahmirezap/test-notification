<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prototype Notifikasi WhatsApp BRI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:#ECE5DD;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.phone{

width:390px;
height:780px;
background:#ECE5DD;
border-radius:35px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.25);

}

/* Header WhatsApp */

.header{

background:#075E54;
color:white;
padding:15px;
display:flex;
align-items:center;

}

.profile{

width:48px;
height:48px;
border-radius:50%;
background:#128C7E;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
margin-right:12px;

}

.name{

font-size:18px;
font-weight:bold;

}

.status{

font-size:12px;
opacity:.9;

}

/* Chat */

.chat{

padding:20px;
background:#ECE5DD;
height:100%;

}

.bubble{

background:white;
width:90%;
padding:18px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);

transform:translateY(250px);
opacity:0;

}

.show{

animation:slideUp .8s ease forwards;

}

@keyframes slideUp{

to{

transform:translateY(0);
opacity:1;

}

}

h3{

margin-bottom:15px;
color:#00529C;

}

button{

margin-top:20px;
background:#00529C;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
font-size:15px;
cursor:pointer;
animation:pulse 1.5s infinite;

}

button:hover{

background:#003D73;

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

.footer{

display:flex;
justify-content:flex-end;
align-items:center;
margin-top:15px;
font-size:12px;
color:#777;

}

.tick{

margin-left:5px;
color:#53BDEB;

}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<div class="profile">
🏦
</div>

<div>

<div class="name">
BRI Info ✓
</div>

<div class="status">
Business Account
</div>

</div>

</div>

<div class="chat">

<div id="bubble" class="bubble">

<h3>🔔 Pengingat KPR - H-60</h3>

<p>
Halo <b>Bapak Batman</b>,
</p>

<br>

<p>
Kami ingin mengingatkan bahwa periode
<b>Fixed Rate</b> KPR Anda akan berakhir
dalam <b>60 hari</b>.
</p>

<br>

<p>
📅 <b>Tanggal Perubahan</b><br>
16 Juni 2026
</p>

<br>

<p>
Silakan buka BRImo untuk melihat
simulasi angsuran terbaru.
</p>

<button onclick="location.href='brimo.html'">

Lihat Detail di BRImo

</button>

<div class="footer">

09.55

<span class="tick">✓✓</span>

</div>

</div>

</div>

</div>

<script>

window.onload=function(){

setTimeout(function(){

let audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

audio.play().catch(()=>{});

document.getElementById("bubble").classList.add("show");

},1000);

}

</script>

</body>
</html>
