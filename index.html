<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Prototype BRI Notification</title>

<style>

body{

margin:0;
background:#ece5dd;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.phone{

width:390px;
height:780px;
background:white;
border-radius:35px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.3);

}

.progress{

width:220px;
height:10px;
background:#ffffff55;
border-radius:30px;
margin-top:30px;
overflow:hidden;

}

.bar{

height:100%;
width:0%;
background:white;
animation:load 2s linear forwards;

}

@keyframes load{

100%{
width:100%;
}

}

#whatsapp{

display:none;
height:100%;
background:#ECE5DD;

}

.header{

background:#075E54;
padding:15px;
color:white;
font-size:22px;
font-weight:bold;

}

.chat{

padding:20px;

}

.bubble{

background:white;
padding:18px;
border-radius:12px;
width:85%;
box-shadow:0 3px 10px rgba(0,0,0,.2);

transform:translateY(300px);
opacity:0;

}

.show{

animation:slideUp .8s forwards;

}

@keyframes slideUp{

100%{

transform:translateY(0);
opacity:1;

}

}

button{

margin-top:20px;
padding:12px 20px;
border:none;
background:#0A84FF;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
animation:pulse 1.5s infinite;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.05);

}

100%{

transform:scale(1);

}

}

.time{

text-align:right;
font-size:12px;
margin-top:10px;
color:gray;

}

</style>

</head>

<body>

<div class="phone">

<div id="whatsapp">

<div class="header">

WhatsApp

</div>

<div class="chat">

<div id="bubble" class="bubble">

<h3>🔔 Pengingat KPR - H-60</h3>

Halo Bapak Batman,

<br><br>

Kami ingin mengingatkan bahwa
periode <b>Fixed Rate</b> KPR Anda akan
berakhir dalam <b>60 hari</b>.

<br><br>

📅 Perubahan suku bunga

<b>16 Juni 2026</b>

<br><br>

Silakan buka BRImo untuk melihat
simulasi angsuran terbaru.

<br>

<button onclick="location.href='brimo.html'">

Lihat Detail di BRImo

</button>

<div class="time">

09.55

</div>

</div>

</div>

</div>

</div>

<script>

setTimeout(function(){

document.getElementById("loading").style.display="none";

document.getElementById("whatsapp").style.display="block";

let audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

audio.play();

setTimeout(function(){

document.getElementById("bubble").classList.add("show");

},500);

},2000);

</script>

</body>

</html>
